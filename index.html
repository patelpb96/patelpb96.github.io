    <!-- Loading screen: Orion, drawn and twinkling until the app script arrives. It lives inside #root,
         so React replaces it on first render. Hidden for the first 350 ms so fast loads never flash it.
         Lite mode and reduced motion get the still constellation. -->
    <style>
      html { background: #160a06; }
      body { margin: 0; }
      .boot { min-height: 100vh; display: grid; place-items: center; opacity: 0; animation: bootIn 0.5s ease 0.35s forwards; }
      .boot svg { width: min(46vw, 190px); height: auto; overflow: visible; }
      .boot line { stroke: rgba(255, 179, 107, 0.5); stroke-width: 0.6; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: bootLine 0.7s ease forwards; animation-delay: calc(0.6s + var(--i) * 0.22s); }
      .boot circle { fill: #fff2e6; transform-box: fill-box; transform-origin: center; animation: bootTwinkle var(--d) ease-in-out infinite; animation-delay: calc(var(--i) * -0.37s); }
      @keyframes bootIn { to { opacity: 1; } }
      @keyframes bootLine { to { stroke-dashoffset: 0; } }
      @keyframes bootTwinkle { 0%, 100% { opacity: 0.45; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.25); } }
      .boot-still .boot, .boot-still .boot line, .boot-still .boot circle { animation: none; opacity: 1; stroke-dashoffset: 0; }
      @media (prefers-reduced-motion: reduce) { .boot, .boot line, .boot circle { animation: none; opacity: 1; stroke-dashoffset: 0; } }
    </style>
    <!-- Lite is the default. The full version is only picked automatically for a device that shows
         every sign of being fast: a mouse (so not a phone or tablet), 8+ processor threads, and, where
         the browser reports them, 8+ GB of memory and a fast connection with data saving off. Safari
         and Firefox report only the first two. A saved choice (the Lite toggle) wins over this guess;
         App.jsx reads window.__fastDevice. -->
    <script>
      (function () {
        var fast = false, saved = null;
        try {
          var c = navigator.connection;
          fast = matchMedia("(hover: hover) and (pointer: fine)").matches
            && !matchMedia("(prefers-reduced-motion: reduce)").matches
            && navigator.hardwareConcurrency >= 8
            && (navigator.deviceMemory === undefined || navigator.deviceMemory >= 8)
            && (!c || (!c.saveData && (c.effectiveType === undefined || c.effectiveType === "4g")));
        } catch (e) { /* no way to tell: stay lite */ }
        window.__fastDevice = fast;
        try { saved = localStorage.getItem("site-lite"); } catch (e) { /* storage blocked */ }
        if (saved === "1" || (saved !== "0" && !fast)) document.documentElement.className = "boot-still";
      })();
    </script>
